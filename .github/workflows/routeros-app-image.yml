name: Build RouterOS App Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/routeros-app-image.yml'
      - 'Dockerfile'
      - 'Makefile'
      - 'src/**'
      - 'routeros-app/**'
  pull_request:
    paths:
      - '.github/workflows/routeros-app-image.yml'
      - 'Dockerfile'
      - 'Makefile'
      - 'src/**'
      - 'routeros-app/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  build-and-push-ghcr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/awg-routeros-app" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: routeros-app/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  routeros-oci-artifacts:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
          - platform: linux/arm64
            slug: arm64
          - platform: linux/arm/v7
            slug: armv7

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Build OCI archive
        shell: bash
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --file routeros-app/Dockerfile \
            --output "type=oci,dest=/tmp/awg-routeros-app-${{ matrix.slug }}.oci.tar" \
            .
          gzip -9 "/tmp/awg-routeros-app-${{ matrix.slug }}.oci.tar"

      - name: Upload OCI archive
        uses: actions/upload-artifact@v4
        with:
          name: awg-routeros-app-${{ matrix.slug }}.oci.tar.gz
          path: /tmp/awg-routeros-app-${{ matrix.slug }}.oci.tar.gz
          if-no-files-found: error

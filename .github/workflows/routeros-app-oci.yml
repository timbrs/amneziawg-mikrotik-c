name: Build RouterOS App OCI Images

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - '.github/workflows/routeros-app-oci.yml'
      - '.gitignore'
      - 'README.md'
      - 'routeros-app/**'
  pull_request:
    paths:
      - '.github/workflows/routeros-app-oci.yml'
      - '.gitignore'
      - 'README.md'
      - 'routeros-app/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/awg-proxy

jobs:
  build-oci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: amd64
            zig_target: x86_64-linux-musl
            oci_arch: amd64
            oci_variant: ''
          - slug: arm64
            zig_target: aarch64-linux-musl
            oci_arch: arm64
            oci_variant: ''
          - slug: armv7
            zig_target: arm-linux-musleabihf
            oci_arch: arm
            oci_variant: v7

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install packer dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends make python3 file skopeo

      - name: Build static binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-dev}"
          cflags="-O2 -Wall -Wextra -Werror -Wno-error=sign-compare -std=c11 -D_GNU_SOURCE -DVERSION=\\\"${version}\\\""
          make -C routeros-app clean
          make -C routeros-app \
            VERSION="${version}" \
            CC="zig cc -target ${{ matrix.zig_target }}" \
            CFLAGS="${cflags}" \
            LDFLAGS="-static -s"
          file routeros-app/awg-proxy routeros-app/awg-routeros-app

      - name: Pack OCI image
        shell: bash
        run: |
          set -euo pipefail
          rootfs="${RUNNER_TEMP}/rootfs-${{ matrix.slug }}"
          out="${RUNNER_TEMP}/awg-proxy-${{ matrix.slug }}.tar.gz"
          rm -rf "${rootfs}"
          mkdir -p "${rootfs}/etc"
          install -m 0755 routeros-app/awg-proxy "${rootfs}/awg-proxy"
          install -m 0755 routeros-app/awg-routeros-app "${rootfs}/awg-routeros-app"
          : > "${rootfs}/etc/resolv.conf"
          chmod +x routeros-app/scripts/make-oci-image.sh
          routeros-app/scripts/make-oci-image.sh \
            "${rootfs}" \
            "${out}" \
            "${{ matrix.oci_arch }}" \
            "awg-proxy:${GITHUB_REF_NAME:-dev}" \
            "${{ matrix.oci_variant }}"
          tar -tzf "${out}" | sort

      - name: Upload RouterOS OCI image
        uses: actions/upload-artifact@v4
        with:
          name: awg-proxy-${{ matrix.slug }}.tar.gz
          path: ${{ runner.temp }}/awg-proxy-${{ matrix.slug }}.tar.gz
          if-no-files-found: error

      - name: Push architecture image to GHCR
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME,,}"
          branch_tag="${GITHUB_REF_NAME//\//-}-${{ matrix.slug }}"
          echo "${GH_TOKEN}" | skopeo login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          skopeo copy \
            "oci-archive:${RUNNER_TEMP}/awg-proxy-${{ matrix.slug }}.tar.gz" \
            "docker://${image}:${branch_tag}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            skopeo copy \
              "oci-archive:${RUNNER_TEMP}/awg-proxy-${{ matrix.slug }}.tar.gz" \
              "docker://${image}:${GITHUB_REF_NAME}-${{ matrix.slug }}"
          fi

  publish-ghcr-index:
    if: github.event_name != 'pull_request'
    needs: build-oci
    runs-on: ubuntu-latest

    steps:
      - name: Install manifest tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends podman skopeo

      - name: Publish GHCR manifest list
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME,,}"
          branch_tag="${GITHUB_REF_NAME//\//-}"
          echo "${GH_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          podman manifest create "${image}:${branch_tag}"
          podman manifest add "${image}:${branch_tag}" "docker://${image}:${branch_tag}-amd64"
          podman manifest add "${image}:${branch_tag}" "docker://${image}:${branch_tag}-arm64"
          podman manifest add "${image}:${branch_tag}" "docker://${image}:${branch_tag}-armv7"
          podman manifest push --all "${image}:${branch_tag}" "docker://${image}:${branch_tag}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            podman manifest push --all "${image}:${branch_tag}" "docker://${image}:latest"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            podman manifest push --all "${image}:${branch_tag}" "docker://${image}:${GITHUB_REF_NAME}"
          fi

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-oci
    runs-on: ubuntu-latest

    steps:
      - name: Download OCI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: awg-proxy-*.tar.gz
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --title "${tag}" \
              --notes "RouterOS 7.21+ OCI images for awg-proxy RouterOS App."
          fi
          gh release upload "${tag}" dist/*.tar.gz --clobber

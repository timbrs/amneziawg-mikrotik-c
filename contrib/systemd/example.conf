# /etc/awg-proxy/NAME.conf - parameters of one awg-proxy@NAME instance.
# systemd EnvironmentFile syntax: KEY=value, no spaces around '=',
# quote values that contain spaces or <...>.
#
# This example is a normal-mode client: a local kernel WireGuard interface
# (wg-quick@NAME) has its peer Endpoint = 127.0.0.1:51820, and the proxy turns
# its traffic into AmneziaWG towards the server.

AWG_LISTEN=127.0.0.1:51820
AWG_REMOTE=SERVER_IP:PORT

AWG_SERVER_PUB=SERVER_PUBLIC_KEY
AWG_CLIENT_PUB=CLIENT_PUBLIC_KEY

AWG_JC=5
AWG_JMIN=30
AWG_JMAX=500
AWG_S1=20
AWG_S2=20
AWG_H1=1234567890
AWG_H2=1234567891
AWG_H3=1234567892
AWG_H4=1234567893
# AWG 1.5 signature packets, only if the server config has them:
#AWG_I1="<b 0x...>"

AWG_LOG_LEVEL=info
